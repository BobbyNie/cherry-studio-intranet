<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Releases Timeline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f2;
        --surface: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #22c55e;
        --tag-bg: #dcfce7;
        --tag-text: #166534;
        --link: #2563eb;
      }

      body.dark {
        --bg: #151515;
        --surface: #000000;
        --text: #ffffff;
        --muted: #9ca3af;
        --border: #374151;
        --tag-bg: #14532d;
        --tag-text: #bbf7d0;
        --link: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .page {
        max-width: 48rem;
        margin: 0 auto;
        padding: 3rem 1rem;
      }

      h1 {
        margin: 0 0 2rem;
        font-size: 1.875rem;
        line-height: 2.25rem;
      }

      .status {
        padding: 2rem 0;
        text-align: center;
        color: var(--muted);
      }

      .status.error {
        color: #ef4444;
      }

      .spinner {
        display: inline-block;
        width: 2rem;
        height: 2rem;
        border: 4px solid var(--border);
        border-top-color: #3b82f6;
        border-radius: 999px;
        animation: spin 1s linear infinite;
      }

      .timeline {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .release {
        position: relative;
        padding-left: 2rem;
        border-left: 2px solid var(--border);
      }

      .release::before {
        position: absolute;
        top: 0;
        left: -0.5rem;
        width: 1rem;
        height: 1rem;
        content: "";
        background: var(--accent);
        border-radius: 999px;
      }

      .release-card {
        padding: 1.5rem;
        background: var(--surface);
        border-radius: 0.5rem;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
      }

      .release-header {
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      h2 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.75rem;
      }

      .date {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.75rem;
        color: var(--tag-text);
        white-space: nowrap;
        background: var(--tag-bg);
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .prose {
        color: var(--muted);
        line-height: 1.6;
      }

      .prose h1,
      .prose h2,
      .prose h3 {
        color: var(--text);
      }

      .prose h1 {
        font-size: 1.5em;
        margin: 1em 0;
      }

      .prose h2 {
        font-size: 1.3em;
        margin: 0.8em 0;
      }

      .prose h3 {
        font-size: 1.1em;
        margin: 0.6em 0;
      }

      .prose ul,
      .prose ol {
        margin-left: 1.5em;
        margin-bottom: 1em;
      }

      .prose code {
        padding: 0.2em 0.4em;
        background: color-mix(in srgb, var(--border), transparent 20%);
        border-radius: 0.2em;
        font-size: 0.9em;
      }

      .prose pre code {
        display: block;
        padding: 1em;
        overflow-x: auto;
      }

      .prose a {
        color: var(--link);
        text-decoration: underline;
      }

      .prose blockquote {
        padding-left: 1em;
        margin: 1em 0;
        border-left: 4px solid var(--border);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <h1>Release Timeline</h1>
      <div id="status" class="status"><span class="spinner" aria-label="Loading releases"></span></div>
      <div id="timeline" class="timeline" hidden></div>
    </main>

    <script>
      const statusEl = document.getElementById('status')
      const timelineEl = document.getElementById('timeline')

      function escapeHtml(text) {
        const div = document.createElement('div')
        div.textContent = text ?? ''
        return div.innerHTML
      }

      function renderMarkdown(content) {
        if (!content) return ''

        return escapeHtml(content)
          .replace(/^### (.*)$/gm, '<h3>$1</h3>')
          .replace(/^## (.*)$/gm, '<h2>$1</h2>')
          .replace(/^# (.*)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>')
          .replace(/\n{2,}/g, '</p><p>')
          .replace(/\n/g, '<br>')
          .replace(/^(.+)$/s, '<p>$1</p>')
      }

      function formatDate(dateString) {
        return new Date(dateString).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        })
      }

      function initTheme() {
        const theme = new URL(window.location.href).searchParams.get('theme')
        document.body.classList.toggle('dark', theme === 'dark')
      }

      function renderReleases(releases) {
        timelineEl.innerHTML = ''

        for (const release of releases) {
          const item = document.createElement('article')
          item.className = 'release'
          item.innerHTML = `
            <div class="release-card">
              <div class="release-header">
                <div>
                  <h2>${escapeHtml(release.name || release.tag_name)}</h2>
                  <p class="date">${formatDate(release.published_at)}</p>
                </div>
                <span class="tag">${escapeHtml(release.tag_name)}</span>
              </div>
              <div class="prose">${renderMarkdown(release.body)}</div>
            </div>
          `
          timelineEl.appendChild(item)
        }

        statusEl.hidden = true
        timelineEl.hidden = false
      }

      async function fetchReleases() {
        try {
          const response = await fetch('https://api.github.com/repos/kangfenmao/cherry-studio/releases')
          if (!response.ok) {
            throw new Error('Failed to fetch releases')
          }
          renderReleases(await response.json())
        } catch (error) {
          statusEl.className = 'status error'
          statusEl.textContent = `Error loading releases: ${error instanceof Error ? error.message : String(error)}`
        }
      }

      initTheme()
      fetchReleases()
    </script>
  </body>
</html>
