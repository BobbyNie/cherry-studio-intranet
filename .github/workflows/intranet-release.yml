name: Intranet 2.0 Release

on:
  push:
    branches: ["2.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intranet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    if: github.ref == 'refs/heads/2.0'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve immutable release tag
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=intranet-v${VERSION}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release quality gate
        run: |
          pnpm lint
          pnpm i18n:hardcoded:strict
          pnpm docs:check
          pnpm test
          git diff --exit-code

  build:
    needs: [metadata, validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
          - os: windows-2022
            platform: win
            arch: arm64
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      CHERRY_INTRANET_MODE: "true"
      CHERRY_DISABLE_PUBLIC_NETWORK: "true"
      CHERRY_DISABLE_AUTO_UPDATE: "true"
      CHERRY_DISABLE_TELEMETRY: "true"
      CHERRY_DISABLE_MARKETPLACE: "true"
      CHERRY_DISABLE_EXTERNAL_LINKS: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - name: Prepare macOS native build tools
        if: matrix.platform == 'mac'
        run: brew install python-setuptools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build intranet installer
        shell: bash
        run: |
          pnpm run build
          pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify and collect installers
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { TARGET_PLATFORM: platform, TARGET_ARCH: arch } = process.env
          const version = require('./package.json').version
          const suffixes = platform === 'mac' ? [`-${arch}.dmg`, `-${arch}.zip`] : [`-${arch}-setup.exe`, `-${arch}-portable.exe`]
          fs.mkdirSync('release-artifacts', { recursive: true })
          for (const suffix of suffixes) {
            const files = fs.readdirSync('dist').filter(file => file.endsWith(suffix))
            if (files.length !== 1 || fs.statSync(path.join('dist', files[0])).size === 0) throw new Error(`Missing or ambiguous installer: ${suffix}`)
            fs.copyFileSync(path.join('dist', files[0]), `release-artifacts/cherry-studio-intranet-${version}-${platform}${suffix}`)
          }
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: intranet-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: intranet-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify complete matrix and generate checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.metadata.outputs.tag }}
          name: Cherry Studio Intranet ${{ needs.metadata.outputs.tag }}
          commit: ${{ github.sha }}
          artifacts: release-artifacts/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          draft: false
          prerelease: false
          makeLatest: false
          body: |
            Cherry Studio 2.0.9 企業內網版，獨立維護於 2.0 分支。

            - macOS arm64 / x64：DMG、ZIP
            - Windows arm64 / x64：Setup、Portable
            - SHA256SUMS.txt 覆蓋全部 8 個安裝檔案。
            - 內網限制已寫入安裝包；首次啟動需配置模型服務及網路白名單。
            - 此批產物未使用平台程式碼簽章，供內網驗收及後續企業簽章。
